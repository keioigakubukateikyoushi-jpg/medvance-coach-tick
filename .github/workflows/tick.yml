name: tick

# これが時計。10分おきに本体を叩く。
# GitHub の schedule は数分〜20分ほど遅れることがあるが、送信の窓は各時刻から50分あるので届く。
# 手動起動は、遅れているときに今すぐ送らせるため。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call coach tick
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=medvance-coach-line" | jq -r .value)
          curl -sS --fail-with-body -m 30 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://medvance-coach-line.vercel.app/api/cron-tick
