name: tick

# GitHub の schedule は何時間も遅れるので時計にしない。
# 残すのは手動起動だけ（鎖が完全に止まったとき用）。
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call coach tick
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=medvance-coach-line" | jq -r .value)
          curl -sS --fail-with-body -m 30 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://medvance-coach-line.vercel.app/api/cron-tick
