name: tick

# 朝・昼・夕方の枠で Medvance コーチLINE の自動送信を起動する。
# */15 は遅れやすいので、07:00 / 12:00 / 16:00 JST も明示する。
# 秘密情報は置かない。GitHub の OIDC トークンで、このリポからの呼び出しだと先方が確認する。
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '50 21 * * *'
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call coach tick
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=medvance-coach-line" | jq -r .value)
          curl -sS --fail-with-body -m 150 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://medvance-coach-line.vercel.app/api/cron-tick
