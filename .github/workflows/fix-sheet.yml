name: fix-sheet

# 配布済みの予定表を、いまの形に作り直す。人が押したときだけ動く。
# Googleの認証情報は本体（Vercel）にしか無いので、ここは叩くだけ。
on:
  workflow_dispatch:
    inputs:
      sheet:
        description: スプレッドシートID または URL
        required: true
      apply:
        description: 実際に書き込む（false なら下見だけ）
        type: boolean
        default: false
      peek:
        description: 中身をそのまま見るタブ名（例 2026年9月）。入れると直さず見るだけ
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Repair or inspect the student timetable sheet
        env:
          SHEET: ${{ inputs.sheet }}
          APPLY: ${{ inputs.apply }}
          PEEK: ${{ inputs.peek }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=medvance-fix-sheet" | jq -r .value)
          if [ -n "$PEEK" ]; then
            BODY=$(jq -n --arg s "$SHEET" --arg p "$PEEK" '{sheet:$s, peek:$p}')
          else
            BODY=$(jq -n --arg s "$SHEET" --argjson a "$APPLY" '{sheet:$s, apply:$a}')
          fi
          curl -sS --fail-with-body -m 120 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            https://medvance-coach-line.vercel.app/api/fix-sheet
